version: '3.8'

# Standalone camera containers, one service per driver, so a single caller
# (e.g. the demomotion_gui launch_server) can bring up just the camera the
# operator picked in the GUI's setup wizard:
#
#   docker compose -f docker-compose.yml up -d realsense
#   docker compose -f docker-compose.yml up -d luxonis
#
# Build once per service before first use:
#   docker compose -f docker-compose.yml build realsense
#   docker compose -f docker-compose.yml build luxonis
#
# Same run flags as ../../realsense/run_docker.sh and ../../luxonis/run_docker.sh
# (host network + privileged + /dev mount so the container can see the USB camera).

services:
  realsense:
    build:
      context: ../../realsense
      dockerfile: Dockerfile
    image: realsense_img:jazzy
    container_name: realsense_cont
    stdin_open: true
    tty: true
    network_mode: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - TERM=xterm-256color
    volumes:
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix
    command: /bin/bash

  luxonis:
    build:
      context: ../../luxonis
      dockerfile: Dockerfile
    image: oak_img:humble
    container_name: oak_cont
    stdin_open: true
    tty: true
    network_mode: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - TERM=xterm-256color
    volumes:
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix
    command: /bin/bash
