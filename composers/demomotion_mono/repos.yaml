# Koji kod ulazi u image (format za vcstool).
# version je GRANA: svaki build uzme njen vrh. Na praćenu granu pushaj samo kod koji radi.
# Stanje razvojnog kontejnera 2026-10-19 (svi repoi čisti i pushani).
#
# Nije ovdje:
#   third_party/sam2  upstream, fiksiran na commit u Dockerfileu (SAM2_COMMIT)
#   gui/OpenGR        lokalno ignoriran (COLCON_IGNORE), stack ga ne koristi
#
# third_party/FoundationPose je u imageu i dostupan na /root/foundationpose/FoundationPose
# (symlink, ista putanja kao u razvojnom kontejneru).
