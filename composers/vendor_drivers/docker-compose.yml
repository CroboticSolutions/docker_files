version: '3.8'

# Per-vendor arm_api2 + driver containers, split out of the combined
# arm_api2_ur_robot/arm_api2_izzy_twist dev containers so arm_api2 (vendor-
# agnostic MoveIt interface) and each vendor's driver/MoveIt/Gazebo stack can
# be started independently. See ../../vendor_split/README.md for the
# full networking contract (host network + matching RMW_IMPLEMENTATION +
# ROS_DOMAIN_ID across all of these, plus the GUI's rosbridge container).
#
# abb_driver is intentionally NOT a service here: its Dockerfile is a
# scaffold with a deliberate `exit 1` (no working ABB ROS 2 driver exists
# yet) — see ../../vendor_split/abb_driver/README.md.
#
#   docker compose -f docker-compose.yml build arm_api2 piper_driver realsense
#   docker compose -f docker-compose.yml up -d arm_api2 piper_driver realsense

services:
  arm_api2:
    build:
      context: ../../vendor_split/arm_api2
      dockerfile: Dockerfile
    image: arm_api2_img:jazzy
    container_name: arm_api2_cont
    stdin_open: true
    tty: true
    network_mode: host
    environment:
      - TERM=xterm-256color
    command: /bin/bash

  piper_driver:
    build:
      context: ../../vendor_split/piper_driver
      dockerfile: Dockerfile
    image: piper_driver_img:jazzy
    container_name: piper_driver_cont
    stdin_open: true
    tty: true
    network_mode: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - XDG_RUNTIME_DIR=/tmp/runtime-root
      - TERM=xterm-256color
    volumes:
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix
    command: /bin/bash

  realsense:
    build:
      context: ../../realsense
      dockerfile: Dockerfile
    image: realsense_img:jazzy
    container_name: realsense_cont
    stdin_open: true
    tty: true
    network_mode: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - TERM=xterm-256color
    volumes:
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix
    command: /bin/bash

  ur_driver:
    build:
      context: ../../vendor_split/ur_driver
      dockerfile: Dockerfile
    image: ur_driver_img:jazzy
    container_name: ur_driver_cont
    stdin_open: true
    tty: true
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - TERM=xterm-256color
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
    command: /bin/bash

  fanuc_driver:
    build:
      context: ../../vendor_split/fanuc_driver
      dockerfile: Dockerfile
    image: fanuc_driver_img:jazzy
    container_name: fanuc_driver_cont
    stdin_open: true
    tty: true
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - TERM=xterm-256color
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
    command: /bin/bash

  # No `build:` -- unlike the others, this isn't built from a Dockerfile in
  # this repo, it's pulled straight from Docker Hub (croboticsolutions/
  # perception:jazzy) and re-tagged locally (see launch_server/hardware_stacks.py
  # CONTAINER_HUB_IMAGE). `runtime: nvidia` needs the host's Docker daemon to
  # have the nvidia container runtime configured (`docker info` lists
  # `nvidia` under Runtimes) -- the image is CUDA 12.8-based and the WiLoR/
  # mediapipe/SAM models it runs are impractically slow on CPU.
  perception:
    image: perception_img:jazzy
    container_name: perception_cont
    stdin_open: true
    tty: true
    network_mode: host
    runtime: nvidia
    environment:
      - TERM=xterm-256color
    command: /bin/bash

  # No `build:` -- same as `perception` above, pulled straight from Docker Hub
  # (croboticsolutions/oak_img:humble) and re-tagged locally (see
  # launch_server/hardware_stacks.py CONTAINER_HUB_IMAGE). `privileged` +
  # `/dev:/dev` for USB access to the physical OAK camera (Movidius VPU,
  # vendor id 03e7 -- see docker_files/luxonis/install_udev_rules_host.sh
  # for the host-side udev rule).
  luxonis:
    image: oak_img:humble
    container_name: oak_cont
    stdin_open: true
    tty: true
    network_mode: host
    privileged: true
    environment:
      - TERM=xterm-256color
    volumes:
      - /dev:/dev
    command: /bin/bash

  # Plain USB/UVC webcam driver (ros2 usb_cam, CroboticSolutions fork,
  # apirsic/devel branch) -- see ../../usb_cam/README.md. RGB only, no
  # depth/pointcloud, unlike realsense/luxonis above. `privileged` +
  # `/dev:/dev` for USB access to the webcam's /dev/videoN node(s) -- same
  # pattern as realsense/luxonis; gui_orchestrator_cont itself needs none of
  # this, it only needs its existing docker-socket mount to build/start this
  # service and `docker exec` into it (see launch_server/hardware_stacks.py
  # CONTAINER_COMPOSE_SERVICE).
  usb_cam:
    build:
      context: ../../usb_cam
      dockerfile: Dockerfile
    image: usb_cam_img:jazzy
    container_name: usb_cam_cont
    stdin_open: true
    tty: true
    network_mode: host
    privileged: true
    environment:
      - TERM=xterm-256color
    volumes:
      - /dev:/dev
    command: /bin/bash

  # Orbbec Femto Bolt ToF camera (OrbbecSDK_ROS2, CroboticSolutions fork,
  # branch v2-main) -- see ../../orbbec/Dockerfile. Its git clone needs the
  # GitHub SSH key forwarded, so build it from the host with
  # `docker compose build --ssh default orbbec`. `privileged` + `/dev:/dev`
  # for USB access, same pattern as realsense/luxonis/usb_cam.
  orbbec:
    build:
      context: ../../orbbec
      dockerfile: Dockerfile
      ssh:
        - default
    image: orbbec_img:jazzy
    container_name: orbbec_cont
    stdin_open: true
    tty: true
    network_mode: host
    privileged: true
    environment:
      - TERM=xterm-256color
    volumes:
      - /dev:/dev
    command: /bin/bash
